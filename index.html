<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Onitsuka Tiger — Inventory System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  
  <style>
    /* Mimic Apple SF Pro / Helvetica Neue clean tracking */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] min-h-screen p-4 flex flex-col items-center select-none overflow-x-hidden">

  <div id="layoutSpacer" class="h-[28vh] transition-all duration-[600ms] ease-in-out w-full"></div>

  <main id="mainContainer" class="w-full max-w-sm flex flex-col transition-all duration-[600ms] ease-in-out relative">
    
    <div id="brandHeader" class="flex flex-col items-center transition-all duration-[600ms] ease-in-out transform origin-top overflow-hidden max-h-24 opacity-100 mb-10 scale-100">
      <h1 class="text-3xl font-black tracking-tighter text-black uppercase" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
        Onitsuka Tiger
      </h1>
    </div>

    <div class="relative w-full mb-3 z-10">
      <input 
        type="text" 
        id="searchInput" 
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Search product..." 
        class="w-full px-5 py-3.5 bg-[#e8e8ed] focus:bg-white border border-transparent focus:border-black rounded-full focus:outline-none transition-all duration-[600ms] ease-in-out text-base text-black placeholder-[#8e8e93] text-center font-normal tracking-wide shadow-sm"
      >
    </div>

    <p id="footnote" class="text-[11px] text-[#8e8e93] text-center tracking-wide font-normal mb-6 transition-opacity duration-300">
      Search product via product name / SKU / colour
    </p>

    <div id="resultsList" class="space-y-2 max-h-64 overflow-y-auto mb-6 hidden absolute top-[70px] left-0 w-full z-20"></div>

    <div id="detailCard" class="w-full bg-white rounded-[24px] p-6 shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-[#e8e8ed] flex flex-col items-center transition-all duration-[600ms] ease-in-out opacity-0 translate-y-4 hidden z-0">
      
      <div class="w-48 h-48 bg-[#fafafa] rounded-2xl flex items-center justify-center p-3 mb-5 overflow-hidden">
        <img id="detailImage" src="" alt="Footwear Model" class="object-contain max-w-full max-h-full mix-blend-multiply">
      </div>

      <h2 id="detailName" class="text-lg font-semibold tracking-tight text-black text-center"></h2>
      <p id="detailColour" class="text-xs font-medium text-[#8e8e93] capitalize mt-0.5 mb-1 text-center"></p>
      <p id="detailSku" class="text-[11px] font-mono tracking-widest text-[#c7c7cc] uppercase mb-5 text-center"></p>
      
      <div class="grid grid-cols-2 gap-px bg-[#e8e8ed] w-full rounded-xl overflow-hidden mb-5 text-center">
        <div class="bg-[#fafafa] py-3 px-2">
          <span class="block text-[9px] text-[#8e8e93] uppercase font-semibold tracking-wider">Quantity</span>
          <span id="detailStock" class="text-sm font-bold text-black mt-0.5 block"></span>
        </div>
        <div class="bg-[#fafafa] py-3 px-2">
          <span class="block text-[9px] text-[#8e8e93] uppercase font-semibold tracking-wider">Shelf Loc</span>
          <span id="detailLocation" class="text-sm font-bold text-black mt-0.5 block"></span>
        </div>
      </div>

      <div class="w-full flex justify-center items-center py-4 bg-white border border-[#f2f2f7] rounded-xl">
        <svg id="barcodeTarget" class="max-w-[90%]"></svg>
      </div>
    </div>
  </main>

  <script src="products.js"></script>

  <script>
    let fuse;
    // Track if a product is currently being displayed
    let isProductShowing = false; 

    function initSearch() {
      const options = {
        keys: ['name', 'sku', 'colour'],
        threshold: 0.35
      };
      fuse = new Fuse(inventoryData, options);
    }

    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    const detailCard = document.getElementById('detailCard');
    const layoutSpacer = document.getElementById('layoutSpacer');
    const footnote = document.getElementById('footnote');
    const brandHeader = document.getElementById('brandHeader');

    // Smooth UI State Controllers
    function hideLogo() {
      brandHeader.classList.remove('max-h-24', 'opacity-100', 'mb-10', 'scale-100');
      brandHeader.classList.add('max-h-0', 'opacity-0', 'mb-0', 'scale-95');
    }

    function showLogo() {
      brandHeader.classList.remove('max-h-0', 'opacity-0', 'mb-0', 'scale-95');
      brandHeader.classList.add('max-h-24', 'opacity-100', 'mb-10', 'scale-100');
    }

    function fadeOutProduct() {
      if (!isProductShowing) return;
      detailCard.classList.remove('opacity-100', 'translate-y-0');
      detailCard.classList.add('opacity-0', 'translate-y-4');
      isProductShowing = false;
      
      // Wait for the fade out to complete before hiding the div entirely
      setTimeout(() => {
        if (!isProductShowing) detailCard.classList.add('hidden');
      }, 600);
    }

    // 1. User taps the search bar
    searchInput.addEventListener('focus', () => {
      layoutSpacer.style.height = '4vh'; 
      
      if (isProductShowing) {
        fadeOutProduct();
        showLogo(); // Bring the logo back to reset the 'empty' state
      }
    });

    // 2. User clicks away without a product selected
    searchInput.addEventListener('blur', () => {
      if (searchInput.value.trim() === '' && !isProductShowing) {
        layoutSpacer.style.height = '28vh';
        showLogo();
      }
    });

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      
      if (query.length < 2) {
        resultsList.innerHTML = '';
        resultsList.classList.add('hidden');
        footnote.classList.remove('opacity-0');
        return;
      }

      footnote.classList.add('opacity-0'); 
      const searchResults = fuse.search(query);
      displayResults(searchResults);
    });

    function displayResults(results) {
      resultsList.innerHTML = '';
      
      if (results.length === 0) {
        resultsList.innerHTML = `<div class="p-4 text-xs text-[#8e8e93] text-center bg-white rounded-2xl border border-[#e8e8ed] shadow-sm">No items found</div>`;
        resultsList.classList.remove('hidden');
        return;
      }

      resultsList.classList.remove('hidden');
      
      results.slice(0, 3).forEach(item => {
        const product = item.item;
        const div = document.createElement('div');
        div.className = "p-3 bg-white active:bg-[#f5f5f7] border border-[#e8e8ed] rounded-2xl cursor-pointer flex items-center justify-between shadow-sm transition-all mb-2";
        
        // Appended the product colour dynamically next to the SKU
        div.innerHTML = `
          <div class="flex items-center space-x-3.5">
            <img src="${product.image}" class="w-9 h-9 object-contain bg-[#fafafa] rounded-lg p-0.5 mix-blend-multiply border border-[#f2f2f7]">
            <div class="text-left">
              <div class="text-xs font-semibold text-black">${product.name}</div>
              <div class="text-[10px] text-[#8e8e93] font-mono tracking-wide">
                ${product.sku} <span class="capitalize px-1 text-[#c7c7cc]">&bull;</span> <span class="capitalize">${product.colour}</span>
              </div>
            </div>
          </div>
          <span class="text-[10px] text-black bg-[#f5f5f7] px-2 py-1 rounded-md font-medium">Qty: ${product.stock}</span>
        `;
        div.onclick = () => selectItem(product);
        resultsList.appendChild(div);
      });
    }

    function selectItem(product) {
      // Clean up the search UI
      resultsList.classList.add('hidden');
      searchInput.value = '';
      searchInput.blur(); 

      // Trigger the new layout transitions
      hideLogo();
      layoutSpacer.style.height = '4vh'; 

      // Load data
      document.getElementById('detailImage').src = product.image;
      document.getElementById('detailName').textContent = product.name;
      document.getElementById('detailColour').textContent = product.colour;
      document.getElementById('detailSku').textContent = product.sku;
      document.getElementById('detailStock').textContent = product.stock;
      document.getElementById('detailLocation').textContent = product.location;
      
      // Fade the product card in smoothly
      detailCard.classList.remove('hidden');
      isProductShowing = true;
      
      // Tiny delay ensures the display:block registers before opacity animates
      setTimeout(() => {
        detailCard.classList.remove('opacity-0', 'translate-y-4');
        detailCard.classList.add('opacity-100', 'translate-y-0');
      }, 20);

      JsBarcode("#barcodeTarget", product.sku, {
        format: "CODE128",
        lineColor: "#000000",
        width: 2.0,
        height: 60,
        displayValue: false
      });
    }

    window.onload = initSearch;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Onitsuka Tiger — Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #layoutSpacer { transition: height 600ms cubic-bezier(0.4, 0, 0.2, 1); }

    #resultsList::-webkit-scrollbar { width: 3px; }
    #resultsList::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 99px; }

    /* Updated focus handling to wrapper */
    #searchRow:focus-within { background: #fff; box-shadow: 0 0 0 1.5px #000; }
    #searchRow #searchInput { flex: 1; min-width: 0; text-align: left; }
    #searchRow #searchInput:focus { outline: none; }

    .result-row { -webkit-tap-highlight-color: transparent; }
    .result-row:active { transform: scale(0.985); }

    #detailCard {
      transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1),
                  transform 400ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    #brandHeader {
      transition: max-height 500ms cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 400ms ease,
                  margin-bottom 500ms cubic-bezier(0.4, 0, 0.2, 1),
                  transform 400ms ease;
    }

    .badge-in  { background:#e8f5e9; color:#2e7d32; }
    .badge-low { background:#fff8e1; color:#f57f17; }
    .badge-out { background:#fce4ec; color:#c62828; }
    .badge-nil { background:#f2f2f7; color:#8e8e93; }

    /* Mode toggle */
    .mode-btn {
      transition: background 200ms, color 200ms;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-btn.active { background: #000; color: #fff; }
    .mode-btn:not(.active) { background: #e8e8ed; color: #3a3a3c; }

    /* Filter panel */
    #filterPanel {
      transition: max-height 500ms cubic-bezier(0.4,0,0.2,1), opacity 400ms ease;
      overflow: hidden;
    }

    /* Section label */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8e8e93;
      margin-bottom: 8px;
    }

    /* Bubble chips */
    .bubble {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 13px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      color: #3a3a3c;
      transition: background 130ms, color 130ms, border-color 130ms, transform 100ms;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      line-height: 1;
    }
    .bubble:active { transform: scale(0.93); }
    .bubble.sel {
      background: #1c1c1e;
      color: #fff;
      border-color: #1c1c1e;
    }
    .bubble .bx { font-size: 14px; opacity: 0.65; margin-left: 1px; line-height: 1; }

    /* Scrollable row for bubbles */
    .bubble-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding-bottom: 2px;
    }

    /* Applied chip in search bar */
    .achip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 600;
      background: #1c1c1e; color: #fff;
      cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .achip:active { opacity: 0.7; }
    .achip .cx { font-size: 13px; opacity: 0.7; }

    /* Results */
    #resultsList { scrollbar-width: thin; }

    /* Back button (inside detail card) */
    #backBtn {
      position: absolute;
      top: 16px; left: 16px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #f2f2f7;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 150ms;
      z-index: 10;
    }
    #backBtn:active { background: #e0e0e5; }

    /* Divider line */
    .filter-divider {
      height: 1px;
      background: #f0f0f5;
      margin: 14px 0;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] min-h-screen p-4 flex flex-col items-center select-none overflow-x-hidden">

  <button id="homeBtn" class="fixed top-6 left-6 text-[11px] font-medium text-[#8e8e93] hover:text-black active:text-black transition-colors flex items-center space-x-1.5 z-50 uppercase tracking-wider">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
    </svg>
    <span>Home</span>
  </button>

  <div id="layoutSpacer" style="height:28vh" class="w-full flex-shrink-0"></div>

  <main id="mainContainer" class="w-full max-w-sm flex flex-col">

    <div id="brandHeader" class="flex flex-col items-center overflow-hidden"
         style="max-height:6rem; opacity:1; margin-bottom:2.5rem; transform:scale(1);">
      <h1 class="text-3xl font-black tracking-tighter text-black uppercase"
          style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
        Onitsuka Tiger
      </h1>
    </div>

    <div class="flex rounded-full overflow-hidden border border-[#e0e0e0] mb-4 w-fit mx-auto shadow-sm">
      <button id="modeBtn1" class="mode-btn active text-[11px] font-semibold tracking-wide px-4 py-1.5 rounded-l-full" onclick="setMode(1)">Search</button>
      <button id="modeBtn2" class="mode-btn text-[11px] font-semibold tracking-wide px-4 py-1.5 rounded-r-full" onclick="setMode(2)">Filter</button>
    </div>

    <div id="searchRow" class="relative w-full z-10 flex items-center bg-[#e8e8ed] rounded-full transition-all duration-300 shadow-sm px-2">
      <div id="activeFilters" class="flex gap-1.5 shrink-0 pl-1 empty:hidden"></div>
      <input
        type="text" id="searchInput"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="Search product…"
        class="w-full px-3 py-3.5 bg-transparent border-transparent outline-none transition-all duration-300 text-base text-black placeholder-[#8e8e93] font-normal tracking-wide"
      >
      <button id="clearBtn" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#8e8e93] hidden bg-transparent" aria-label="Clear">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div id="filterPanel" style="max-height:0px; opacity:0;">
      <div class="mt-5 w-full bg-white rounded-2xl border border-[#e8e8ed] shadow-sm px-4 pt-4 pb-3">

        <div class="section-label">Model</div>
        <div id="typeBubbles" class="bubble-row"></div>

        <div class="filter-divider"></div>

        <div class="section-label">Colour</div>
        <div id="colourBubbles" class="bubble-row"></div>

      </div>

      <div id="filterCount" class="text-[11px] text-[#8e8e93] text-center mt-3 hidden">
        <span id="filterCountText"></span>
      </div>
    </div>

    <div id="resultsList" class="space-y-2 max-h-72 overflow-y-auto mt-3 mb-1 w-full hidden z-20"></div>

    <p id="footnote" class="text-[11px] text-[#8e8e93] text-center tracking-wide font-normal mt-3 mb-6 transition-opacity duration-300">
      Search by product name, SKU or colour
    </p>

    <div id="detailCard"
         class="relative w-full bg-white rounded-[24px] p-6 shadow-[0_4px_24px_rgba(0,0,0,0.06)] border border-[#e8e8ed] flex flex-col items-center opacity-0 translate-y-4 hidden z-0">

      <div id="backBtn" class="hidden" title="Back to results">
        <svg class="w-4 h-4 text-[#3a3a3c]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
      </div>

      <div class="w-48 h-48 bg-[#fafafa] rounded-2xl flex items-center justify-center p-3 mb-5 overflow-hidden">
        <img id="detailImage" src="" alt="Product" class="object-contain max-w-full max-h-full mix-blend-multiply">
      </div>

      <h2 id="detailName"   class="text-lg font-semibold tracking-tight text-black text-center"></h2>
      <p  id="detailColour" class="text-xs font-medium text-[#8e8e93] capitalize mt-0.5 mb-1 text-center"></p>
      <p  id="detailSku"    class="text-[11px] font-mono tracking-widest text-[#c7c7cc] uppercase mb-5 text-center"></p>

      <div class="grid grid-cols-2 gap-px bg-[#e8e8ed] w-full rounded-xl overflow-hidden mb-5 text-center">
        <div class="bg-[#fafafa] py-3 px-2">
          <span class="block text-[9px] text-[#8e8e93] uppercase font-semibold tracking-wider mb-0.5">Quantity</span>
          <span id="detailStock" class="text-sm font-bold text-black block"></span>
          <span id="stockBadge" class="inline-block mt-1 text-[9px] font-semibold px-1.5 py-0.5 rounded-full tracking-wide"></span>
        </div>
        <div class="bg-[#fafafa] py-3 px-2">
          <span class="block text-[9px] text-[#8e8e93] uppercase font-semibold tracking-wider mb-0.5">Shelf Loc</span>
          <span id="detailLocation" class="text-sm font-bold text-black block"></span>
        </div>
      </div>

      <div class="w-full flex flex-col items-center bg-white border border-[#f2f2f7] rounded-xl py-4 px-3 gap-2 mb-2">
        <span class="text-[9px] text-[#8e8e93] uppercase font-semibold tracking-wider">Product Code</span>
        <span id="barcodeLabel1" class="text-[11px] font-mono tracking-[0.18em] text-[#3a3a3c] font-medium select-all"></span>
        <svg id="barcodeTarget" class="max-w-[90%]"></svg>
      </div>

      <div class="w-full flex flex-col items-center bg-white border border-[#f2f2f7] rounded-xl py-4 px-3 gap-2">
        <span class="text-[9px] text-[#8e8e93] uppercase font-semibold tracking-wider">Colour Code</span>
        <span id="barcodeLabel2" class="text-[11px] font-mono tracking-[0.18em] text-[#3a3a3c] font-medium select-all"></span>
        <svg id="barcodeTarget2" class="max-w-[90%]"></svg>
      </div>
    </div>

    <div class="h-8"></div>
  </main>

  <script src="products.js"></script>
  <script>
    /* ─── Helpers ─── */
    function isNil(val) {
      return val === undefined || val === null || String(val).trim().toUpperCase() === 'NIL' || String(val).trim() === '';
    }

    function stockMeta(raw) {
      if (isNil(raw)) return { qty: null, badgeClass: 'badge-nil', badgeText: 'Not set', displayStock: '—' };
      const qty = parseInt(raw, 10);
      if (isNaN(qty)) return { qty: null, badgeClass: 'badge-nil', badgeText: 'Not set', displayStock: String(raw) };
      if (qty <= 0)   return { qty, badgeClass: 'badge-out', badgeText: 'Out of stock', displayStock: String(qty) };
      if (qty <= 3)   return { qty, badgeClass: 'badge-low', badgeText: 'Low stock',    displayStock: String(qty) };
      return                 { qty, badgeClass: 'badge-in',  badgeText: 'In stock',     displayStock: String(qty) };
    }

    /* Split SKU into [productCode, colourCode] */
    function splitSku(sku) {
      const idx = sku.lastIndexOf('-');
      if (idx === -1) return [sku, null];
      return [sku.slice(0, idx), sku.slice(idx + 1)];
    }

    /* ─── Shoe type bubbles ─── */
    const SHOE_TYPES = [
      'MEXICO 66', 'MEXICO 66 SD', 'MEXICO 66 PF', 'MEXICO 66 SABOT',
      'MEXICO 66 SLIP ON', 'MEXICO 66 PARATY', 'MEXICO 66 VINY',
      'MEXICO 66 SD VIN', 'MEXICO 66 SD PARATY',
      'SERRANO', 'SERRANO SLIP ON',
      'CALIFORNIA 78', 'CALIFORNIA 78 EX', 'CALIFORNIA 78 VIN',
      'GSM', 'GSM SD',
      'CORSAIR', 'CORSAIR A55',
      'TIGRUN', 'TIGTRAIL', 'TIGCOURT', 'TGRS',
      'ROTEMIT', 'EDR 78', 'TOKUTEN',
      'NIPPON MADE', 'GOLF', 'DELEGATION',
      'OHBORI STRAP', 'OHBORI SLIDER 2.0',
      'REBILAC SANDAL', 'TSUNAHIKI SLIP ON'
    ];

    /* ─── Colour groups — expanded for Onitsuka naming ─── */
    const COLOUR_GROUPS = [
      { label: 'White',    aliases: ['white','cream','ivory','blanc','off-white','snow','milk','chalk','pearl','birch'] },
      { label: 'Black',    aliases: ['black','noir','onyx','jet','ebony','charcoal','midnight','pitch'] },
      { label: 'Grey',     aliases: ['grey','gray','ash','smoke','stone','silver','slate','graphite','cement','cool grey','warm grey'] },
      { label: 'Red',      aliases: ['red','crimson','scarlet','tomato','cardinal','cherry','burgundy','wine','maroon','berry','rose red','firebrick','flame','poppy'] },
      { label: 'Pink',     aliases: ['pink','rose','blush','salmon','coral','peach','dragonfruit','dragon fruit','flamingo','petal','candy','bubblegum','fuchsia','magenta','hot pink','baby pink','blossom','carnation','watermelon','raspberry','mauve','dusty rose','nude','lilac pink'] },
      { label: 'Orange',   aliases: ['orange','amber','tangerine','rust','apricot','burnt orange','pumpkin','papaya','mango','ginger','clay','terracotta','cinnamon','copper'] },
      { label: 'Yellow',   aliases: ['yellow','lemon','gold','mustard','sun','butter','banana','canary','saffron','amber yellow','wheat','sand yellow','maize','corn','straw'] },
      { label: 'Green',    aliases: ['green','olive','sage','mint','forest','jade','lime','emerald','fern','moss','khaki','army','hunter','leaf','grass','pistachio','sea green','teal green','avocado','spring','aloe'] },
      { label: 'Blue',     aliases: ['blue','navy','cobalt','indigo','sky','royal','azure','teal','cyan','aqua','marine','midnight blue','ocean','steel blue','powder blue','ice blue','airy blue','periwinkle','cornflower','sapphire','peacock','denim','baby blue','air blue','electric blue','stone blue'] },
      { label: 'Purple',   aliases: ['purple','violet','lavender','plum','lilac','mauve','orchid','grape','amethyst','mulberry','eggplant','heather','wisteria'] },
      { label: 'Brown',    aliases: ['brown','tan','camel','chocolate','mocha','cognac','khaki','beige','taupe','sand','espresso','hazel','bark','chestnut','coffee','caramel','walnut','sienna','fawn','toffee','mushroom','nude','latte','biscuit','almond'] },
      { label: 'Metallic', aliases: ['metallic','glitter','holographic','shiny','chrome','iridescent','foil','sparkle','shimmer','mirror','glossy','reflective'] },
      { label: 'Multi',    aliases: ['multi','mix','rainbow','colorful','colourful','patterned','tie-dye','tiedye','print','camo','camouflage','floral','stripe','check','plaid','graphic','abstract'] },
    ];

    /* ─── State ─── */
    let fuse;
    let isProductShowing = false;
    let currentMode = 1;
    let activeTypeFilter   = null;
    let activeColourFilter = null;
    // Snapshot of results shown before product was opened (for back button)
    let lastFilterResults  = null;

    /* ─── DOM refs ─── */
    const searchInput    = document.getElementById('searchInput');
    const clearBtn       = document.getElementById('clearBtn');
    const resultsList    = document.getElementById('resultsList');
    const detailCard     = document.getElementById('detailCard');
    const layoutSpacer   = document.getElementById('layoutSpacer');
    const footnote       = document.getElementById('footnote');
    const brandHeader    = document.getElementById('brandHeader');
    const homeBtn        = document.getElementById('homeBtn');
    const filterPanel    = document.getElementById('filterPanel');
    const typeBubblesEl  = document.getElementById('typeBubbles');
    const colourBubblesEl= document.getElementById('colourBubbles');
    const backBtn        = document.getElementById('backBtn');
    const filterCount    = document.getElementById('filterCount');
    const filterCountText= document.getElementById('filterCountText');
    const activeFiltersEl= document.getElementById('activeFilters');

    /* ─── Init ─── */
    function initSearch() {
      fuse = new Fuse(inventoryData, {
        keys: ['name','sku','colour'],
        threshold: 0.35,
        ignoreLocation: true,
        minMatchCharLength: 2,
      });
      renderTypeBubbles();
      renderColourBubbles();
    }

    /* ─── Logo helpers ─── */
    function hideLogo() {
      brandHeader.style.maxHeight    = '0px';
      brandHeader.style.opacity      = '0';
      brandHeader.style.marginBottom = '0px';
      brandHeader.style.transform    = 'scale(0.95)';
    }
    function showLogo() {
      brandHeader.style.maxHeight    = '6rem';
      brandHeader.style.opacity      = '1';
      brandHeader.style.marginBottom = '2.5rem';
      brandHeader.style.transform    = 'scale(1)';
    }

    /* ─── Product card show/hide ─── */
    function fadeOutProduct(cb) {
      if (!isProductShowing) { if (cb) cb(); return; }
      detailCard.style.opacity   = '0';
      detailCard.style.transform = 'translateY(1rem)';
      isProductShowing = false;
      setTimeout(() => {
        detailCard.classList.add('hidden');
        if (cb) cb();
      }, 400);
    }

    /* ─── Back button: return to filter results ─── */
    backBtn.addEventListener('click', () => {
      fadeOutProduct(() => {
        if (currentMode === 2 && lastFilterResults !== null) {
          displayResultsRaw(lastFilterResults);
          filterCount.classList.remove('hidden');
          layoutSpacer.style.height = '4vh';
        }
      });
    });

    /* ─── Mode switching ─── */
    function setMode(m) {
      currentMode = m;
      document.getElementById('modeBtn1').classList.toggle('active', m === 1);
      document.getElementById('modeBtn2').classList.toggle('active', m === 2);

      if (m === 2) {
        filterPanel.style.maxHeight = '700px';
        filterPanel.style.opacity   = '1';
        footnote.style.opacity      = '0';
        layoutSpacer.style.height   = '4vh';
        hideLogo();
        resultsList.innerHTML = '';
        resultsList.classList.add('hidden');
        filterCount.classList.add('hidden');
      } else {
        filterPanel.style.maxHeight = '0px';
        filterPanel.style.opacity   = '0';
        activeTypeFilter   = null;
        activeColourFilter = null;
        lastFilterResults  = null;
        renderActiveFilters();
        renderTypeBubbles();
        renderColourBubbles();
        resultsList.innerHTML = '';
        resultsList.classList.add('hidden');
        filterCount.classList.add('hidden');
        footnote.style.opacity = '1';
        if (!isProductShowing) {
          layoutSpacer.style.height = '28vh';
          showLogo();
        }
      }
      searchInput.value = '';
      clearBtn.classList.add('hidden');
    }

    /* ─── Dynamic Sorting Logic ─── */
    function getSortedModels() {
      const counts = {};
      inventoryData.forEach(p => {
        counts[p.name] = (counts[p.name] || 0) + 1;
      });

      let models = [...SHOE_TYPES];

      // Popularity
      models.sort((a, b) => {
        if (a === activeTypeFilter || b === activeTypeFilter) return 0;
        const aCount = counts[a] || 0;
        const bCount = counts[b] || 0;
        return bCount - aCount;
      });

      // Search relevance
      const query = searchInput.value.trim().toUpperCase();
      if (query.length >= 2) {
        models.sort((a, b) => {
          const aMatch = a.includes(query);
          const bMatch = b.includes(query);
          if (aMatch && !bMatch) return -1;
          if (!aMatch && bMatch) return 1;
          return 0;
        });
      }

      // Selected model always first
      models.sort((a, b) => {
        if (a === activeTypeFilter) return -1;
        if (b === activeTypeFilter) return 1;
        return 0;
      });

      return models;
    }

    function getSortedColours() {
      let pool = inventoryData;
      if (activeTypeFilter) {
        pool = pool.filter(p => p.name === activeTypeFilter || (p.name || '').toUpperCase().includes(activeTypeFilter.toUpperCase()));
      }

      return [...COLOUR_GROUPS]
        .map(group => {
          const count = pool.filter(product => {
            const colour = (product.colour || '').toLowerCase().replace(/-/g, ' ');
            return group.aliases.some(alias => colour.includes(alias));
          }).length;
          return { ...group, count };
        })
        .filter(group => group.count > 0)
        .sort((a, b) => {
          if (activeColourFilter && a.label === activeColourFilter.label) return -1;
          if (activeColourFilter && b.label === activeColourFilter.label) return 1;
          return b.count - a.count;
        });
    }

    /* ─── Bubble rendering ─── */
    function renderTypeBubbles() {
      typeBubblesEl.innerHTML = '';
      getSortedModels().forEach(type => {
        const count = inventoryData.filter(p => p.name === type).length;
        const btn = document.createElement('button');
        const isSel = activeTypeFilter === type;
        btn.className = 'bubble' + (isSel ? ' sel' : '');
        btn.textContent = `${type} (${count})`;
        
        if (isSel) {
          const x = document.createElement('span');
          x.className = 'bx'; x.textContent = '×';
          btn.appendChild(x);
        }
        btn.addEventListener('click', () => toggleTypeFilter(type));
        typeBubblesEl.appendChild(btn);
      });
    }

    function renderColourBubbles() {
      colourBubblesEl.innerHTML = '';
      getSortedColours().forEach(group => {
        const isSel = activeColourFilter && activeColourFilter.label === group.label;
        const btn = document.createElement('button');
        btn.className = 'bubble' + (isSel ? ' sel' : '');
        btn.textContent = `${group.label} (${group.count})`;

        if (isSel) {
          const x = document.createElement('span');
          x.className = 'bx'; x.textContent = '×';
          btn.appendChild(x);
        }
        btn.addEventListener('click', () => toggleColourFilter(group));
        colourBubblesEl.appendChild(btn);
      });
    }

    /* ─── Active Filter Chips Inside Search Bar ─── */
    function renderActiveFilters() {
      activeFiltersEl.innerHTML = '';
      if (activeTypeFilter) {
        const chip = document.createElement('div');
        chip.className = 'achip';
        chip.innerHTML = `${activeTypeFilter} <span class="cx">×</span>`;
        chip.addEventListener('click', () => toggleTypeFilter(activeTypeFilter));
        activeFiltersEl.appendChild(chip);
      }
      if (activeColourFilter) {
        const chip = document.createElement('div');
        chip.className = 'achip';
        chip.innerHTML = `${activeColourFilter.label} <span class="cx">×</span>`;
        chip.addEventListener('click', () => toggleColourFilter(activeColourFilter));
        activeFiltersEl.appendChild(chip);
      }
    }

    /* ─── Filter toggles ─── */
    function toggleTypeFilter(type) {
      activeTypeFilter = (activeTypeFilter === type) ? null : type;
      renderActiveFilters();
      renderTypeBubbles();
      renderColourBubbles();
      runFilteredSearch();
    }

    function toggleColourFilter(group) {
      activeColourFilter = (activeColourFilter && activeColourFilter.label === group.label) ? null : group;
      renderActiveFilters();
      renderColourBubbles();
      runFilteredSearch();
    }

    /* ─── Core: filter + optional text ─── */
    function runFilteredSearch() {
      const query = searchInput.value.trim();
      const hasFilters = activeTypeFilter || activeColourFilter;
      const hasQuery   = query.length >= 2;

      if (!hasFilters && !hasQuery) {
        resultsList.innerHTML = '';
        resultsList.classList.add('hidden');
        filterCount.classList.add('hidden');
        footnote.style.opacity = currentMode === 1 ? '1' : '0';
        return;
      }

      footnote.style.opacity = '0';

      let pool = inventoryData;

      if (activeTypeFilter) {
        const tf = activeTypeFilter.toUpperCase();
        pool = pool.filter(p => {
          const name = (p.name || '').toUpperCase();
          return name === tf || name.startsWith(tf + ' ') || name.includes(' ' + tf + ' ') || name.endsWith(' ' + tf);
        });
      }

      if (activeColourFilter) {
        const aliases = activeColourFilter.aliases;
        pool = pool.filter(p => {
          const col = (p.colour || '').toLowerCase().replace(/-/g, ' ');
          return aliases.some(a => col.includes(a));
        });
      }

      let results;
      if (hasQuery) {
        const localFuse = new Fuse(pool, {
          keys: ['name','sku','colour'],
          threshold: 0.35,
          ignoreLocation: true,
          minMatchCharLength: 2,
        });
        results = localFuse.search(query).map(r => r.item);
      } else {
        results = pool;
      }

      lastFilterResults = results;
      displayResultsRaw(results);

      // Show count
      if (currentMode === 2) {
        const n = results.length;
        filterCountText.textContent = n === 0 ? 'No products match' : `${n} product${n > 1 ? 's' : ''} found`;
        filterCount.classList.remove('hidden');
      }
    }

    /* ─── Display helpers ─── */
    function displayResultsRaw(items) {
      resultsList.innerHTML = '';
      if (items.length === 0) {
        resultsList.innerHTML = `
          <div class="p-4 text-xs text-[#8e8e93] text-center bg-white rounded-2xl border border-[#e8e8ed] shadow-sm">
            No products found
          </div>`;
        resultsList.classList.remove('hidden');
        return;
      }
      resultsList.classList.remove('hidden');
      // In filter mode show up to 12; in search mode up to 6/8
      const cap = currentMode === 2 ? 12 : 8;
      items.slice(0, cap).forEach(p => {
        const { badgeClass, badgeText } = stockMeta(p.stock);
        const div = document.createElement('div');
        div.className = "result-row p-3 bg-white border border-[#e8e8ed] rounded-2xl cursor-pointer flex items-center justify-between shadow-sm transition-transform duration-150";
        div.innerHTML = `
          <div class="flex items-center space-x-3.5 min-w-0">
            <img src="${p.image || ''}" onerror="this.src=''"
              class="w-9 h-9 object-contain flex-shrink-0 bg-[#fafafa] rounded-lg p-0.5 mix-blend-multiply border border-[#f2f2f7]">
            <div class="text-left min-w-0">
              <div class="text-xs font-semibold text-black truncate">${p.name}</div>
              <div class="text-[10px] text-[#8e8e93] font-mono tracking-wide truncate">
                ${p.sku} &bull; <span class="capitalize">${p.colour}</span>
              </div>
            </div>
          </div>
          <span class="flex-shrink-0 ml-2 text-[9px] font-semibold px-2 py-1 rounded-full ${badgeClass}">${badgeText}</span>
        `;
        div.addEventListener('mousedown', e => e.preventDefault());
        div.addEventListener('click', () => selectItem(p));
        resultsList.appendChild(div);
      });
    }

    /* ─── Select product ─── */
    function selectItem(product) {
      resultsList.classList.add('hidden');
      filterCount.classList.add('hidden');
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      searchInput.blur();
      hideLogo();
      layoutSpacer.style.height = '4vh';

      const { badgeClass, badgeText, displayStock } = stockMeta(product.stock);
      const displayLocation = isNil(product.location) ? '—' : product.location;

      document.getElementById('detailImage').src            = product.image || '';
      document.getElementById('detailName').textContent     = product.name;
      document.getElementById('detailColour').textContent   = product.colour;
      document.getElementById('detailSku').textContent      = product.sku;
      document.getElementById('detailStock').textContent    = displayStock;
      document.getElementById('detailLocation').textContent = displayLocation;

      const badge = document.getElementById('stockBadge');
      badge.textContent = badgeText;
      badge.className   = `inline-block mt-1 text-[9px] font-semibold px-1.5 py-0.5 rounded-full tracking-wide ${badgeClass}`;

      // Split SKU for barcodes
      const [productCode, colourCode] = splitSku(product.sku);
      document.getElementById('barcodeLabel1').textContent = productCode;
      document.getElementById('barcodeLabel2').textContent = colourCode || '—';

      // Show back button only in filter mode
      if (currentMode === 2) {
        backBtn.classList.remove('hidden');
      } else {
        backBtn.classList.add('hidden');
      }

      detailCard.classList.remove('hidden');
      detailCard.style.opacity   = '0';
      detailCard.style.transform = 'translateY(1rem)';
      isProductShowing = true;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        detailCard.style.opacity   = '1';
        detailCard.style.transform = 'translateY(0)';
      }));

      try {
        JsBarcode("#barcodeTarget", productCode, {
          format: "CODE128", lineColor: "#1c1c1e", width: 1.8, height: 56, displayValue: false, margin: 0,
        });
      } catch { document.getElementById('barcodeTarget').innerHTML = ''; }

      if (colourCode) {
        try {
          JsBarcode("#barcodeTarget2", colourCode, {
            format: "CODE128", lineColor: "#1c1c1e", width: 1.8, height: 56, displayValue: false, margin: 0,
          });
        } catch { document.getElementById('barcodeTarget2').innerHTML = ''; }
      } else {
        document.getElementById('barcodeTarget2').innerHTML = '';
      }
    }

    /* ─── Reset to home ─── */
    function resetToHome() {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      resultsList.innerHTML = '';
      resultsList.classList.add('hidden');
      filterCount.classList.add('hidden');
      footnote.style.opacity = '1';
      activeTypeFilter   = null;
      activeColourFilter = null;
      lastFilterResults  = null;
      currentMode = 1;
      document.getElementById('modeBtn1').classList.add('active');
      document.getElementById('modeBtn2').classList.remove('active');
      filterPanel.style.maxHeight = '0px';
      filterPanel.style.opacity   = '0';
      renderActiveFilters();
      renderTypeBubbles();
      renderColourBubbles();
      fadeOutProduct();
      showLogo();
      layoutSpacer.style.height = '28vh';
    }

    homeBtn.addEventListener('click', resetToHome);

    /* ─── Clear button ─── */
    clearBtn.addEventListener('mousedown', e => {
      e.preventDefault();
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      if (currentMode === 1) {
        resultsList.innerHTML = '';
        resultsList.classList.add('hidden');
        footnote.style.opacity = '1';
      } else {
        runFilteredSearch();
      }
      searchInput.focus();
    });

    /* ─── Input focus/blur ─── */
    searchInput.addEventListener('focus', () => {
      layoutSpacer.style.height = '4vh';
      if (isProductShowing && currentMode === 1) {
        fadeOutProduct();
        showLogo();
      }
    });

    searchInput.addEventListener('blur', () => {
      if (searchInput.value.trim() === '' && !isProductShowing && currentMode === 1) {
        layoutSpacer.style.height = '28vh';
        showLogo();
      }
    });

    /* ─── Input handler ─── */
    searchInput.addEventListener('input', e => {
      const query = e.target.value.trim();
      clearBtn.classList.toggle('hidden', query.length === 0);

      if (currentMode === 1) {
        if (query.length < 2) {
          resultsList.innerHTML = '';
          resultsList.classList.add('hidden');
          footnote.style.opacity = '1';
          return;
        }
        footnote.style.opacity = '0';
        const fuseResults = fuse.search(query);
        resultsList.innerHTML = '';
        if (fuseResults.length === 0) {
          resultsList.innerHTML = `
            <div class="p-4 text-xs text-[#8e8e93] text-center bg-white rounded-2xl border border-[#e8e8ed] shadow-sm">
              No products found
            </div>`;
          resultsList.classList.remove('hidden');
          return;
        }
        resultsList.classList.remove('hidden');
        fuseResults.slice(0, 6).forEach(item => {
          const p = item.item;
          const { badgeClass, badgeText } = stockMeta(p.stock);
          const div = document.createElement('div');
          div.className = "result-row p-3 bg-white border border-[#e8e8ed] rounded-2xl cursor-pointer flex items-center justify-between shadow-sm transition-transform duration-150";
          div.innerHTML = `
            <div class="flex items-center space-x-3.5 min-w-0">
              <img src="${p.image || ''}" onerror="this.src=''"
                class="w-9 h-9 object-contain flex-shrink-0 bg-[#fafafa] rounded-lg p-0.5 mix-blend-multiply border border-[#f2f2f7]">
              <div class="text-left min-w-0">
                <div class="text-xs font-semibold text-black truncate">${p.name}</div>
                <div class="text-[10px] text-[#8e8e93] font-mono tracking-wide truncate">
                  ${p.sku} &bull; <span class="capitalize">${p.colour}</span>
                </div>
              </div>
            </div>
              <span class="flex-shrink-0 ml-2 text-[9px] font-semibold px-2 py-1 rounded-full ${badgeClass}">${badgeText}</span>
          `;
          div.addEventListener('mousedown', e => e.preventDefault());
          div.addEventListener('click', () => selectItem(p));
          resultsList.appendChild(div);
        });
      } else {
        renderTypeBubbles();
        renderColourBubbles();
        runFilteredSearch();
      }
    });

    window.addEventListener('load', initSearch);
  </script>
</body>
</html>
